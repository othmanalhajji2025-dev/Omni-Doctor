<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة الطقس — Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>لوحة الطقس</h1>

    <form id="searchForm" class="search">
      <input id="cityInput" placeholder="ابحث عن مدينة (مثال: Cairo)" aria-label="City" />
      <button type="submit">بحث</button>
    </form>

    <section id="status" class="status">أدخل اسم مدينة لبدء البحث.</section>

    <section id="current" class="card hidden">
      <h2 id="place"></h2>
      <div class="current-grid">
        <div class="big-temp" id="temp"></div>
        <div class="details">
          <div id="condition"></div>
          <div>سرعة الرياح: <span id="wind"></span></div>
          <div>اتجاه الرياح: <span id="windDir"></span></div>
          <div>رطوبة: <span id="humidity"></span></div>
        </div>
      </div>
    </section>

    <section id="forecast" class="hidden">
      <h3>توقع الأيام القادمة</h3>
      <div id="forecastList" class="forecast-list"></div>
    </section>

    <footer class="footer">
      بيانات من Open‑Meteo · لا حاجة لمفتاح API · مثال تعليمي
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
